name: Companion OSC Module Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Must run before setup-node, as its yarn cache step needs the yarn version from packageManager
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run unit tests
        run: yarn test
